name: flutter_unionad
description: 字节跳动 穿山甲广告Flutter版
version: 3.0.0
homepage: https://github.com/gstory0404/flutter_unionad

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
#  unionad_interface:
#    path: ../unionad_interface
#  unionad_android:
#    path: ../unionad_android
#  unionad_ios:
#    path: ../unionad_ios
#  unionad_ohos:
#    path: ../unionad_ohos
  unionad_interface: ^1.0.0
  unionad_android: ^1.0.0
  unionad_ohos: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        default_package: unionad_android
      # iOS 暂不接广告：不声明平台实现，穿山甲 SDK 不会进 iOS 安装包。
      # 要恢复时加回 ios 的 default_package 与上面的 unionad_ios 依赖。
      ohos:
        default_package: unionad_ohos
